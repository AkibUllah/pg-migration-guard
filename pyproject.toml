[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-migration-guard"
description = "PostgreSQL migration linter whose lock and rewrite claims are checked against real servers."
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
dependencies = [
    "pglast>=8,<9",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
probe = ["psycopg[binary]>=3.2,<4"]
dev = [
    "psycopg[binary]>=3.2,<4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
pgmg = "migration_guard.cli:main"

[tool.setuptools.packages.find]
include = ["migration_guard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["pg: needs a real PostgreSQL server (set PGMG_TEST_DSN)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
